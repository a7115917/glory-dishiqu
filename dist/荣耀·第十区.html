<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="荣耀">
<meta name="description" content="荣耀 · 第十区 —— 全职高手同人实时战斗文字游戏">
<title>荣耀 · 第十区</title>
<!-- 单文件离线版：所有样式与脚本已内联，可直接双击运行或发到手机 -->
<style>
/* ==========================================================================
   荣耀 · 第十区   —  样式表
   ========================================================================== */

:root{
  --bg:        #06090f;
  --bg-2:      #0a0f18;
  --panel:     #0c121c;
  --panel-2:   #101825;
  --line:      #1a2635;
  --line-2:    #26384d;
  --txt:       #c7d3e3;
  --txt-dim:   #78899f;
  --txt-mute:  #4d5d72;
  --accent:    #4fe3c8;
  --accent-d:  #1f8f7e;
  --gold:      #dcaa52;
  --danger:    #e2574c;
  --hp:        #cf4a44;
  --mp:        #3f86d8;
  --xp:        #c9a13c;

  --serif: "Noto Serif SC","Source Han Serif SC","Songti SC","STSong",SimSun,serif;
  --sans:  "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:  ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  height:100%;
  background:var(--bg);
  color:var(--txt);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

button{ font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; border:0; background:none; }
input{ font-family:inherit; font-size:inherit; color:inherit; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:#1e2c3d; border-radius:4px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ------------------------------------------------------------------ 屏幕 */
.screen{ display:none; position:fixed; inset:0; }
.screen.show{ display:flex; }

/* ------------------------------------------------------------ 标题界面 */
#scr-title{
  align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 0%, #12243a 0%, #06090f 62%);
}
.title-bg{
  position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(79,227,200,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,227,200,.045) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse at 50% 40%, #000 0%, transparent 76%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%, #000 0%, transparent 76%);
  animation:drift 24s linear infinite;
}
@keyframes drift{ to{ background-position:64px 64px, 64px 64px; } }

.title-inner{ position:relative; text-align:center; padding:0 24px; }

.logo{
  font-family:var(--serif);
  font-size:clamp(64px,13vw,112px);
  font-weight:700;
  letter-spacing:.14em;
  line-height:1;
  color:#e8f2ff;
  text-shadow:0 0 42px rgba(79,227,200,.34), 0 0 2px rgba(255,255,255,.5);
  margin-right:-.14em;
}
.logo span{ color:var(--accent); }

.logo-sub{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.44em;
  color:var(--txt-mute);
  margin-top:18px;
  margin-right:-.44em;
}
.welcome{
  display:inline-block;
  font-family:var(--serif);
  font-size:clamp(14px,1.5vw,17px);
  font-weight:600;
  letter-spacing:.14em;
  color:#0a0e15;
  margin-top:34px;
  padding:7px 22px;
  border-radius:2px;
  background:linear-gradient(180deg,#f2d485 0%,#dcae52 52%,#bb8c30 100%);
  box-shadow:0 0 0 1px rgba(255,232,175,.55) inset,
             0 0 34px rgba(216,169,74,.35),
             0 10px 30px rgba(0,0,0,.45);
  text-shadow:0 1px 0 rgba(255,240,200,.45);
  animation:welFade .9s ease both;
}
@keyframes welFade{
  from{ opacity:0; transform:translateY(8px); }
  to{ opacity:1; transform:none; }
}
.logo-line{
  font-family:var(--serif);
  font-size:13px;
  color:var(--txt-mute);
  margin-top:12px;
  letter-spacing:.1em;
}

.title-btns{ display:flex; gap:14px; justify-content:center; margin-top:44px; flex-wrap:wrap; }
.title-tip{
  margin-top:34px; font-size:12px; color:var(--txt-mute);
  font-family:var(--mono); letter-spacing:.1em;
}

/* -------------------------------------------------------------- 按钮 */
.btn{
  padding:11px 30px;
  border:1px solid var(--line-2);
  border-radius:3px;
  background:rgba(255,255,255,.02);
  color:var(--txt-dim);
  font-size:14px;
  letter-spacing:.16em;
  transition:.18s;
}
.btn:hover{ border-color:var(--accent-d); color:var(--txt); background:rgba(79,227,200,.06); }
.btn:disabled{ opacity:.28; cursor:not-allowed; }
.btn-main{
  border-color:var(--accent-d);
  color:var(--accent);
  background:rgba(79,227,200,.08);
  box-shadow:0 0 24px rgba(79,227,200,.1) inset;
}
.btn-main:hover{ background:rgba(79,227,200,.16); color:#b8fff1; }

/* -------------------------------------------------------- 创建角色界面 */
#scr-create{
  align-items:center; justify-content:center;
  overflow-y:auto;
  background:radial-gradient(ellipse at 50% 0%, #101d2e 0%, #06090f 60%);
}
.create-inner{ width:min(940px,92vw); padding:44px 0; }

.create-h{
  font-family:var(--serif); font-size:26px; font-weight:400;
  letter-spacing:.3em; color:var(--txt); text-align:center;
  margin-bottom:34px; margin-right:-.3em;
}

.name-row{
  display:flex; align-items:center; gap:14px;
  max-width:420px; margin:0 auto 30px;
}
.name-row label{ font-size:13px; color:var(--txt-dim); white-space:nowrap; letter-spacing:.1em; }
.name-row input{
  flex:1; padding:10px 14px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:3px; outline:none; transition:.18s;
}
.name-row input:focus{ border-color:var(--accent-d); box-shadow:0 0 0 3px rgba(79,227,200,.08); }

.class-grid{
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:12px; margin-bottom:20px;
}
.class-card{
  padding:16px 14px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:4px; text-align:left; transition:.18s;
  position:relative;
}
.class-card:hover{ border-color:var(--line-2); background:var(--panel-2); }
.class-card.on{
  border-color:var(--accent-d);
  background:linear-gradient(180deg, rgba(79,227,200,.1), rgba(79,227,200,.02));
  box-shadow:0 0 0 1px rgba(79,227,200,.25), 0 0 28px rgba(79,227,200,.08);
}
.cc-cat{ font-family:var(--mono); font-size:10px; color:var(--txt-mute); letter-spacing:.18em; }
.cc-name{ font-family:var(--serif); font-size:19px; color:var(--txt); margin:5px 0 3px; }
.class-card.on .cc-name{ color:var(--accent); }
.cc-tag{ font-size:11px; color:var(--txt-mute); }

.class-detail{
  min-height:96px;
  padding:16px 18px;
  background:var(--panel);
  border:1px solid var(--line);
  border-left:2px solid var(--accent-d);
  border-radius:3px;
  font-family:var(--serif);
  font-size:14px;
  line-height:1.85;
  color:var(--txt-dim);
}
.class-detail b{ color:var(--accent); font-weight:400; }
.class-detail em{ font-style:normal; color:var(--gold); }

.create-actions{ display:flex; gap:12px; justify-content:center; margin-top:26px; }

/* -------------------------------------------------------- 游戏主界面 */
#scr-game{ flex-direction:column; background:var(--bg); }

.topbar{
  height:52px; flex:0 0 52px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, #0b1119, #080c13);
}
.chapter{
  font-family:var(--serif); font-size:14px; letter-spacing:.2em;
  color:var(--txt-dim);
}
.topbar-r{ display:flex; align-items:center; gap:8px; }
.chip{
  font-family:var(--mono); font-size:12px;
  padding:3px 10px; border-radius:2px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  color:var(--txt-dim);
}
.chip-dim{ color:var(--txt-mute); }
.chip-gold{ color:var(--gold); border-color:rgba(220,170,82,.28); background:rgba(220,170,82,.07); }
.icon-btn{
  width:32px; height:32px; border-radius:3px;
  border:1px solid var(--line); color:var(--txt-dim);
  display:grid; place-items:center; font-size:14px; transition:.18s;
}
.icon-btn:hover{ border-color:var(--accent-d); color:var(--accent); }

.layout{
  flex:1; min-height:0;
  display:grid; grid-template-columns:minmax(0,1fr) 336px;
}

/* ---------------------------------------------------------------- 舞台 */
.stage{
  overflow-y:auto; padding:26px 34px 60px;
  scroll-behavior:smooth;
}
.art{
  height:150px; border-radius:5px; margin-bottom:24px;
  position:relative; overflow:hidden;
  border:1px solid var(--line);
  transition:background .6s;
}
.art::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 50% 120%, transparent 30%, rgba(6,9,15,.86) 100%),
    linear-gradient(90deg, rgba(6,9,15,.9) 0%, transparent 46%);
  pointer-events:none;
}
.art-char{
  position:absolute; right:20px; bottom:-56px;
  width:195px; height:254px;
  opacity:.92;
  pointer-events:none;
  filter:drop-shadow(0 0 12px var(--pc, #4fe3c8)) drop-shadow(0 18px 44px rgba(0,0,0,.9));
  mask-image:linear-gradient(180deg, #000 70%, transparent 100%);
  -webkit-mask-image:linear-gradient(180deg, #000 70%, transparent 100%);
}
.art-char::before{
  content:""; position:absolute; inset:-8% 2% 6% 2%; z-index:-1;
  background:var(--pc, #4fe3c8);
  opacity:.2;
  border-radius:50%;
  filter:blur(30px);
}
.art-night{ background:linear-gradient(165deg,#0c1b2e 0%,#0a1220 55%,#060a11 100%); }
.art-lake { background:linear-gradient(165deg,#102a2b 0%,#0d1f24 55%,#07100f 100%); }
.art-city { background:linear-gradient(165deg,#251d0f 0%,#181309 55%,#0a0805 100%); }
.art-tomb { background:linear-gradient(165deg,#1a1a26 0%,#12121b 55%,#08080d 100%); }
.art-arena{ background:linear-gradient(165deg,#2a1220 0%,#1a0b14 55%,#0a0510 100%); }
.art-snow { background:linear-gradient(165deg,#16263a 0%,#101b2b 55%,#080d15 100%); }

.story{ max-width:760px; }

.prose{
  font-family:var(--serif);
  font-size:16px;
  line-height:2.05;
  color:#bcc9db;
  white-space:pre-wrap;
  word-break:break-word;
  letter-spacing:.02em;
  min-height:40px;
}
.prose .sys{
  font-family:var(--mono);
  font-size:13px;
  color:var(--accent);
  background:rgba(79,227,200,.07);
  border-left:2px solid var(--accent-d);
  padding:1px 8px;
  border-radius:2px;
  letter-spacing:0;
  display:inline-block;
  margin:1px 0;
}

/* -------------------------------------------------------------- 选项 */
.choices{ margin-top:34px; display:flex; flex-direction:column; gap:9px; }

.choice{
  display:flex; align-items:baseline; gap:14px;
  width:100%; text-align:left;
  padding:13px 18px;
  background:linear-gradient(90deg, rgba(255,255,255,.035), rgba(255,255,255,.01));
  border:1px solid var(--line);
  border-left:2px solid var(--line-2);
  border-radius:3px;
  transition:.16s;
  animation:rise .32s backwards;
}
.choice:nth-child(1){ animation-delay:.02s; }
.choice:nth-child(2){ animation-delay:.07s; }
.choice:nth-child(3){ animation-delay:.12s; }
.choice:nth-child(4){ animation-delay:.17s; }
.choice:nth-child(5){ animation-delay:.22s; }
.choice:nth-child(6){ animation-delay:.27s; }
.choice:nth-child(7){ animation-delay:.32s; }
@keyframes rise{ from{ opacity:0; transform:translateY(7px);} to{ opacity:1; transform:none;} }

.choice:hover:not(:disabled){
  border-color:var(--accent-d);
  border-left-color:var(--accent);
  background:linear-gradient(90deg, rgba(79,227,200,.1), rgba(79,227,200,.015));
  padding-left:24px;
}
.choice:disabled{ opacity:.4; cursor:not-allowed; }

.choice .num{
  font-family:var(--mono); font-size:11px; color:var(--txt-mute);
  flex:0 0 auto; padding-top:2px;
}
.choice:hover:not(:disabled) .num{ color:var(--accent); }
.choice .txt{ flex:1; font-size:15px; color:var(--txt); }
.choice .hint{
  font-family:var(--mono); font-size:11px; color:var(--txt-mute);
  flex:0 0 auto;
}
.choice .lock{
  font-family:var(--mono); font-size:11px; color:var(--danger);
  flex:0 0 auto;
}

/* ---------------------------------------------------------------- 面板 */
.panel{
  border-left:1px solid var(--line);
  background:var(--panel);
  display:flex; flex-direction:column;
  min-height:0;
}
.p-head{
  display:flex; gap:12px; align-items:center;
  padding:14px 16px; border-bottom:1px solid var(--line);
}
.p-top{ padding:0; border:0; }
.p-name{ font-family:var(--serif); font-size:17px; color:var(--txt); }
.p-meta{ font-family:var(--mono); font-size:11px; color:var(--txt-mute); margin-top:2px; letter-spacing:.08em; }

.p-bars{ padding:12px 16px; display:flex; flex-direction:column; gap:7px; border-bottom:1px solid var(--line); }
.bar{
  position:relative; height:16px; border-radius:2px;
  background:#0a1017; border:1px solid var(--line);
  overflow:hidden;
}
.bar i{
  position:absolute; inset:0 auto 0 0; width:0;
  background:linear-gradient(90deg,#3a2a2a,#6b2f2b);
  transition:width .35s ease;
}
.bar.hp i{ background:linear-gradient(90deg,#6d2823,#cf4a44); }
.bar.mp i{ background:linear-gradient(90deg,#22355c,#3f86d8); }
.bar.xp i{ background:linear-gradient(90deg,#4a3a12,#c9a13c); }
.bar b{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10px; font-weight:400;
  color:#dbe6f5; text-shadow:0 1px 2px rgba(0,0,0,.9); letter-spacing:.05em;
}

.p-tabs{ display:flex; border-bottom:1px solid var(--line); }
.p-tabs button{
  flex:1; padding:9px 0; font-size:12px; color:var(--txt-mute);
  border-bottom:2px solid transparent; transition:.16s; letter-spacing:.1em;
}
.p-tabs button:hover{ color:var(--txt-dim); }
.p-tabs button.on{ color:var(--accent); border-bottom-color:var(--accent); background:rgba(79,227,200,.04); }

.p-body{ flex:1; overflow-y:auto; padding:14px 16px 24px; font-size:13px; }

/* 属性行 */
.stat-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 0; border-bottom:1px dashed rgba(38,56,77,.5);
}
.stat-row .k{ color:var(--txt-dim); font-size:12.5px; }
.stat-row .v{ font-family:var(--mono); color:var(--txt); font-size:13px; }
.stat-row .v small{ color:var(--txt-mute); font-size:11px; }
.stat-row.sub .k{ color:var(--txt-mute); font-size:11.5px; padding-left:10px; }
.stat-row.sub .v{ color:var(--txt-dim); font-size:12px; }

.plus{
  width:20px; height:20px; line-height:17px; text-align:center;
  border:1px solid var(--line-2); border-radius:2px;
  color:var(--accent); font-size:14px;
}
.plus:hover{ background:rgba(79,227,200,.14); }
.plus:disabled{ opacity:.22; cursor:not-allowed; }

.free-pt{
  margin:10px 0 4px; padding:8px 10px;
  background:rgba(220,170,82,.08);
  border:1px solid rgba(220,170,82,.25);
  border-radius:2px;
  color:var(--gold); font-size:12px;
  font-family:var(--mono); letter-spacing:.06em;
}
.sec-title{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
  color:var(--txt-mute); margin:16px 0 4px;
}
.sec-title:first-child{ margin-top:0; }

/* 背包 */
.item-row{
  display:flex; align-items:center; gap:10px;
  padding:8px 0; border-bottom:1px dashed rgba(38,56,77,.5);
}
.item-row .nm{ flex:1; color:var(--txt); font-size:13px; }
.item-row .nm small{ display:block; color:var(--txt-mute); font-size:11px; }
.item-row .ct{ font-family:var(--mono); color:var(--txt-dim); font-size:11.5px; }
.mini{
  padding:3px 9px; border:1px solid var(--line-2); border-radius:2px;
  font-size:11px; color:var(--txt-dim); transition:.16s;
}
.mini:hover{ border-color:var(--accent-d); color:var(--accent); }
.mini.on{ border-color:var(--gold); color:var(--gold); }

/* 技能 */
.skill-row{
  padding:9px 0; border-bottom:1px dashed rgba(38,56,77,.5);
}
.skill-row .sn{ display:flex; justify-content:space-between; align-items:baseline; }
.skill-row .sn b{ font-weight:400; color:var(--txt); font-size:13px; }
.skill-row .sn span{ font-family:var(--mono); font-size:10.5px; color:var(--txt-mute); }
.skill-row p{ font-size:11.5px; color:var(--txt-mute); margin-top:3px; line-height:1.55; }

.empty{ color:var(--txt-mute); font-size:12px; padding:16px 0; text-align:center; }

/* ---------------------------------------------------------------- 战斗 */
.overlay{
  position:fixed; inset:0; z-index:60;
  background:rgba(3,5,9,.86);
  backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  animation:fade .22s;
}
@keyframes fade{ from{opacity:0} to{opacity:1} }
.overlay[hidden]{ display:none; }

.battle{
  width:min(660px,100%);
  max-height:92vh;
  display:flex; flex-direction:column;
  background:linear-gradient(180deg,#0d1520,#070b11);
  border:1px solid var(--line-2);
  border-radius:5px;
  box-shadow:0 30px 90px rgba(0,0,0,.75), 0 0 0 1px rgba(79,227,200,.06);
  overflow-y:auto;
}

.battle-h{
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(226,87,76,.07), transparent);
}
.foe-id{ display:flex; align-items:baseline; gap:10px; margin-bottom:9px; }
.foe-name{ font-family:var(--serif); font-size:17px; color:#f0d9d6; }
.foe-lv{ font-family:var(--mono); font-size:11px; color:var(--txt-mute); }
.foe-bar{
  position:relative; height:14px; border-radius:2px; overflow:hidden;
  background:#0a1017; border:1px solid var(--line);
}
.foe-bar i{
  position:absolute; inset:0 auto 0 0; width:100%;
  background:linear-gradient(90deg,#6d2823,#cf4a44);
  transition:width .3s ease;
}
.foe-bar b{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:10px; font-weight:400; color:#e6d5d3;
  text-shadow:0 1px 2px #000;
}

.battle-log{
  flex:1; min-height:110px; max-height:220px;
  overflow-y:auto; padding:14px 20px;
  font-size:13px; line-height:1.85;
  font-family:var(--serif);
  color:var(--txt-dim);
  display:flex; flex-direction:column; gap:1px;
}
.log-line{ animation:rise .22s backwards; }
.log-line.dmg{ color:#d8b3af; }
.log-line.crit{ color:#ffb9a5; }
.log-line.hurt{ color:#e2574c; }
.log-line.heal{ color:#7fd8a8; }
.log-line.good{ color:var(--accent); }
.log-line.mute{ color:var(--txt-mute); }
.log-line.sys{ font-family:var(--mono); font-size:11.5px; color:var(--gold); }

.self-bars{ padding:12px 20px 4px; display:flex; gap:10px; }
.self-bars .bar{ flex:1; }

.battle-actions{
  padding:14px 20px 18px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr));
  gap:8px;
  border-top:1px solid var(--line);
  margin-top:10px;
}
.act-btn{
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:3px;
  background:rgba(255,255,255,.025);
  text-align:left;
  transition:.15s;
  position:relative;
  overflow:hidden;
}
.act-btn:hover:not(:disabled){ border-color:var(--accent-d); background:rgba(79,227,200,.09); }
.act-btn:disabled{ opacity:.32; cursor:not-allowed; }
.act-btn .an{ display:block; font-size:13.5px; color:var(--txt); }
.act-btn .ac{
  display:block; font-family:var(--mono); font-size:10.5px;
  color:var(--txt-mute); margin-top:2px;
}
.act-btn.skill .an{ color:#b8fff1; }

  sanren: 'hood', jianke: 'ponytail', kuangjian: 'spiky', mojian: 'long',
  zhangui: 'long', zhengui: 'hood',
  zhanfa: 'ponytail', modao: 'hat', yuansu: 'hood', zhaohuan: 'hood',

  renzhe: 'hood', daozei: 'hood', cike: 'hood', shushi: 'hood',
  mushi: 'halo', qishi: 'helmet', shouhu: 'halo', qumo: 'bandana'
};

let ptSeq = 0;

function portraitSVG(clsId, mode) {
  const c = CLASSES[clsId];
  if (!c) return '';

  const sfx = ++ptSeq;
  const pb = `url(#ptb-${sfx})`;
  const col = c.color;

  const headKey = PT_HEAD_OF[clsId] || 'short';
  const head = (PT_HEADS[headKey] || PT_HEADS.short)(pb, col);
  const body = (PT_BODIES[c.body] || PT_BODIES.sword)(pb, col);
  const weapon = (PT_WEAPONS[c.weapon.t] || PT_WEAPONS.blade)(pb, col, c.weapon);
  const faceDark = (c.body === 'mage' || c.body === 'night' || headKey === 'hood')
    ? `<ellipse cx="100" cy="88" rx="16" ry="19" fill="#050308"/>
       <circle cx="94" cy="85" r="2" fill="${col}"/><circle cx="106" cy="85" r="2" fill="${col}"/>`
    : '';

  const vb = mode === 'face' ? '46 26 108 108' : '0 0 200 260';

  return `<svg class="pt-svg" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ptg-${sfx}" cx="50%" cy="36%" r="64%">
      <stop offset="0" stop-color="${col}" stop-opacity=".40"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ptb-${sfx}" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="${shade(col, 0.55)}"/>
      <stop offset=".45" stop-color="${shade(col, 0.16)}"/>
      <stop offset="1" stop-color="#04070b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" fill="url(#ptg-${sfx})"/>
  <circle cx="100" cy="110" r="78" fill="none" stroke="${col}" stroke-opacity=".12"/>
  <circle cx="100" cy="110" r="96" fill="none" stroke="${col}" stroke-opacity=".055"/>
  ${weaponBehind(c, pb, col)}
  <path d="M90 86 L110 86 L112 126 L88 126 Z" fill="${pb}"/>
  ${body}
  <ellipse cx="100" cy="86" rx="22" ry="26" fill="${pb}"
           stroke="${col}" stroke-opacity=".45" stroke-width="1.2"/>
  ${faceDark}
  ${head}
  ${weaponFront(c, pb, col)}
</svg>`;
}

/* 武器画在身体前面还是后面 */
function weaponBehind(c, pb, col) {
  const t = c.weapon.t;
  if (t === 'wings') return PT_WEAPONS.wings(pb, col);
  if (t === 'curseorb' || t === 'talisman' || t === 'gadget') return PT_WEAPONS[t](pb, col);
  return '';
}
function weaponFront(c, pb, col) {
  const t = c.weapon.t;
  if (t === 'wings' || t === 'curseorb' || t === 'talisman' || t === 'gadget') return '';
  return (PT_WEAPONS[t] || PT_WEAPONS.blade)(pb, col, c.weapon);
}

/* 颜色明暗 */
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * k);
  const g = Math.round(((n >> 8) & 255) * k);
  const b = Math.round((n & 255) * k);
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
}

function portraitColor(clsId) {
  const c = CLASSES[clsId];
  return c ? c.color : '#4fe3c8';
}

function portraitName(clsId) {
  const c = CLASSES[clsId];
  return c ? c.name : '';
}

<script>
/* ==========================================================================
   荣耀 · 第十区  —   实时战斗内核
   --------------------------------------------------------------------------
   1 tick = 200ms，双方同时跑自己的时间轴：
     cast  前摇  —— 这段时间被打中会被「打断」，技能直接没了
     rec   后摇  —— 收招硬直，此时是「破绽」，受到伤害 +45%
     stun  硬直  —— 被打断之后动不了
   · 连招接上了：后摇只有 55%，伤害逐层+18%
   · 没接上就放：后摇 160%，全程挂「破绽」——这就是不看连招的代价
   · 后摇期间可以预输入下一招，收招瞬间自动接上
   ========================================================================== */

const Combat = (function () {

const TICK = 200;              // 每拍毫秒
const OPENING_DMG = 1.45;      // 破绽增伤
const LINK_REC = 0.55;         // 接上连招的后摇系数
const MISS_REC = 1.6;          // 没接上的后摇系数

let api = null;                // GameAPI
let P = null, E = null;        // 双方运行时
let timer = null;
let running = false;
let onEndCb = null;
let startTime = 0;
let lastSecs = 0;
let lastResult = null;

/* ---------------------------------------------------------------- 启动 */
function configure(a) { api = a; }

function start(enemyId, opts) {
  const tpl = ENEMIES[enemyId];
  if (!tpl) { console.warn('没有这个敌人', enemyId); return; }

  const S = api.S;
  const d = api.derived(S);
  S.hp = Math.min(S.hp, d.maxHp);

  P = {
    state: 'idle', t: 0, cd: {}, buffs: {},
    combo: 0, lastIdx: -1, lastSchool: null, lastForm: null, queue: null,
    form: S.form || 'sword', castForm: null, castInfo: null,
    pending: null, mul: 1, recMod: 1, penalty: false,
    spdMod: 1 - Math.min(0.22, S.agi * 0.005)
  };
  S.skills.forEach(id => { P.cd[id] = 0; });

  const e = JSON.parse(JSON.stringify(tpl));
  E = {
    id: enemyId, name: e.name, level: e.level, boss: !!e.boss,
    hp: e.hp, maxHp: e.hp, atk: e.atk, def: e.def, spd: e.spd,
    exp: e.exp || 0, gold: e.gold || 0, loot: e.loot || [],
    skills: e.skills || [], cd: {}, buffs: {},
    state: 'idle', t: 0, atkUp: 0, defDown: 0
  };
  (e.skills || []).forEach((s, i) => { E.cd[i] = 0; });

  lastResult = null;
  running = true;
  startTime = Date.now();

  buildBattleUI();
  api.openOverlay();
  log('遭遇 ' + E.name + '（Lv.' + E.level + '）', 'mute');
  render();
  clearInterval(timer);
  timer = setInterval(tick, TICK);
  tick();                     // 立刻走一拍，避免开战静止
}

/* ---------------------------------------------------------------- 主循环 */
function tick() {
  if (!running) return;
  const S = api.S;

  stepPlayer(S);
  stepEnemy(S);
  regen(S);
  render();
  checkEnd(S);
}

function stepPlayer(S) {
  if (P.state === 'idle') return;
  P.t--;
  if (P.t > 0) return;

  if (P.state === 'cast') {
    resolvePlayerCast(S);
  } else {
    // rec / stun 结束
    P.state = 'idle';
    P.penalty = false;
    if (P.queue) {
      const q = P.queue;
      P.queue = null;
      tryCast(S, q);
    }
  }
}

function stepEnemy(S) {
  if (E.state === 'idle') { enemyDecide(S); return; }
  E.t--;
  if (E.t > 0) return;

  if (E.state === 'cast') {
    resolveEnemyCast(S);
  } else {
    E.state = 'idle';
  }
}

function regen(S) {
  const d = api.derived(S);
  S.mp = Math.min(d.maxMp, S.mp + (1.4 + S.int * 0.1) * (TICK / 1000));
  // 冷却
  for (const k in P.cd) if (P.cd[k] > 0) P.cd[k]--;
  for (const k in E.cd) if (E.cd[k] > 0) E.cd[k]--;
  for (const k in P.buffs) if (--P.buffs[k] <= 0) delete P.buffs[k];
  if (E.atkUp > 0) E.atkUp--;
  if (E.defDown > 0) E.defDown--;
}

/* ---------------------------------------------------------------- 玩家 */
function tryCast(S, id) {
  const sk = SKILLS[id];
  if (!sk) return false;
  if (P.state !== 'idle') { P.queue = id; return false; }
  if (S.mp < sk.mp) { api.toast('法力不足'); return false; }
  if ((P.cd[id] || 0) > 0) { api.toast('冷却中'); return false; }

  S.mp -= sk.mp;
  P.cd[id] = sk.cd;

  // —— 连招判定 ——
  const cls = api.classOf(S.cls);
  const info = chainInfo(cls, id);

  let mul = 1;
  let recMod = MISS_REC;
  let penalty = false;

  if (info.util) {
    recMod = 1;
  } else if (cls.freeChain) {
    if (!P.lastSchool) { recMod = 1; mul = 1; }
    else if (info.link) { recMod = LINK_REC; mul = 1 + 0.15 * (P.combo + 1); }
    else { recMod = MISS_REC; penalty = true; }
  } else {
    if (info.idx === 0) { recMod = 1; mul = 1; }
    else if (info.link) {
      recMod = LINK_REC;
      mul = 1 + 0.18 * (P.combo + 1);
      if (P.combo + 1 >= cls.chain.length - 1) mul *= 1.3;   // 这一招就是终结
    }
    else { recMod = MISS_REC; penalty = true; }
  }

  P.pending = id;
  P.castForm = P.form;
  P.castInfo = info;
  P.mul = mul;
  P.recMod = recMod * P.spdMod;
  P.penalty = penalty;
  P.state = 'cast';
  P.t = Math.max(1, Math.round(sk.cast * P.spdMod));
  P.queue = null;

  if (penalty) log('【' + sk.name + '】硬起手——没有接上连招。', 'warn');
  else if (info.link) log('连招 · ' + sk.name, 'combo');
  else log('【' + sk.name + '】', 'good');

  return true;
}

function chainInfo(cls, id) {
  const sk = SKILLS[id];
  if (sk.util) return { util: true, link: false, idx: -1 };
  if (cls.freeChain) {
    return { util: false, link: !!P.lastForm && P.form !== P.lastForm, idx: -1 };
  }
  const idx = cls.chain.indexOf(id);
  if (idx < 0) return { util: true, link: false, idx: -1 };
  return { util: false, link: P.lastIdx === idx - 1, idx: idx };
}

function resolvePlayerCast(S) {
  if (P.pending === '__basic') {
    strikeEnemy({ name: '普通攻击', power: 100 }, S);
    P.pending = null;
    P.state = 'rec';
    P.t = Math.max(1, Math.round(3 * P.recMod));
    return;
  }
  const sk = SKILLS[P.pending];
  const cls = api.classOf(S.cls);
  const info = P.castInfo || { util: true, idx: -1 };

  if (sk.buff) {
    P.buffs[sk.buff.dodge ? 'dodge' : sk.buff.guard ? 'guard' : 'power'] =
      (sk.buff.dodge || sk.buff.guard || sk.buff.power) + 60;   // 60 tick = 12s
    log('增益生效。', 'good');
  }  if (sk.stun) { E.state = 'stun'; E.t = sk.stun; log(E.name + ' 被控住！', 'combo'); }
  if (sk.power) strikeEnemy(sk, S);
  if (sk.heal) {
    const d = api.derived(S);
    const h = Math.round(d.maxHp * sk.heal);
    S.hp = Math.min(d.maxHp, S.hp + h);
    log('回复 ' + h + ' 点生命。', 'heal');
  }
  if (sk.selfDmg) {
    const d = api.derived(S);
    const h = Math.round(d.maxHp * sk.selfDmg);
    S.hp = Math.max(1, S.hp - h);
    log('反噬，损失 ' + h + ' 点生命。', 'hurt');
  }

  // 提交连招状态
  if (!info.util) {
    if (cls.freeChain) {
      const f = P.castForm || P.form;
      if (!P.lastForm) P.combo = 0;
      else if (f !== P.lastForm) P.combo = Math.min(5, P.combo + 1);
      else P.combo = 0;
      P.lastForm = f;
    } else {
      if (info.link || info.idx === 0) P.combo = info.idx === 0 ? 0 : Math.min(cls.chain.length - 1, P.combo + 1);
      else P.combo = 0;
      P.lastIdx = info.idx;
    }
  }

  // 终结判定
  const finished = !cls.freeChain && cls.chain.length > 1 && P.combo >= cls.chain.length - 1 && !info.util;
  if (finished && sk.power) {
    log('连招完成！' + cls.chain.map(x => SKILLS[x].name).join(' → '), 'combo');
    const back = Math.round(sk.mp * 0.5);
    const d = api.derived(S);
    S.mp = Math.min(d.maxMp, S.mp + back);
    E.defDown = 3;
    log('返灵 ' + back + ' 点法力，' + E.name + ' 破防。', 'combo');
    P.combo = 0;
    P.lastIdx = -1;
  }

  P.state = 'rec';
  P.t = Math.max(1, Math.round(sk.rec * P.recMod));
}

function strikeEnemy(sk, S) {
  const d = api.derived(S);
  const scale = sk.scale || api.classOf(S.cls).main;
  const atk = d.atk[scale];
  const hits = sk.hits || 1;

  // 敌方闪避
  if (Math.random() * 100 < Math.max(0, E.spd * 0.4 - 1)) {
    log(E.name + ' 侧身闪开。', 'mute');
    return;
  }

  let mult = P.mul;
  let tag = '';
  if (E.state === 'cast') { mult *= 1.25; tag = ' · 打断！'; E.state = 'stun'; E.t = 3; log('你打断了 ' + E.name + ' 的施法！', 'combo'); }
  else if (E.state === 'rec') { mult *= OPENING_DMG; tag = ' · 破绽'; }

  let total = 0, crit = false;
  for (let i = 0; i < hits; i++) {
    let dmg = atk * (sk.power / 100) * (0.92 + Math.random() * 0.16) * mult;
    const def = E.def * (1 - (sk.pierce || 0)) * (1 - (E.defDown > 0 ? 0.25 : 0));
    dmg *= 100 / (100 + def * 1.6);
    if (Math.random() * 100 < d.crit + (sk.crit || 0)) { dmg *= 1.8; crit = true; }
    total += Math.max(1, Math.round(dmg));
  }
  E.hp = Math.max(0, E.hp - total);
  log(sk.name + ' 命中，' + total + ' 伤害' + (crit ? '（暴击）' : '') + tag, crit ? 'crit' : 'dmg');
}

/* ---------------------------------------------------------------- 敌人 */
function enemyDecide(S) {
  if (E.state !== 'idle') return;
  const d = api.derived(S);

  // 可用技能
  const pool = E.skills.filter((s, i) => (E.cd[i] || 0) <= 0);
  if (!pool.length) {
    // 普攻兜底
    E.state = 'cast'; E.t = 2; E.pending = { name: '普通攻击', power: 100, cast: 2, rec: 3, cd: 0 };
    E.castLen = 2;
    return;
  }

  // 玩家正在前摇 → 优先用快招打断
  let pick = null;
  if (P.state === 'cast') {
    pick = pool.find(s => (s.cast || 3) <= P.t + 1);
  }
  if (!pick) {
    // 玩家在后摇 → 打重招
    if (P.state === 'rec') {
      const heavy = pool.filter(s => (s.power || 0) >= 140);
      if (heavy.length && Math.random() < 0.7) pick = heavy[Math.floor(Math.random() * heavy.length)];
    }
  }
  if (!pick) pick = pool[Math.floor(Math.random() * pool.length)];

  const idx = E.skills.indexOf(pick);
  if (idx >= 0) E.cd[idx] = pick.cd || 20;
  E.pending = pick;
  E.state = 'cast';
  E.castLen = Math.max(1, Math.round((pick.cast || 3) * (1 - Math.min(0.2, E.spd * 0.006))));
  E.t = E.castLen;
}

function resolveEnemyCast(S) {
  const sk = E.pending;
  const d = api.derived(S);

  if (sk.buff) {
    E.atkUp = 60; log(E.name + ' 气势暴涨。', 'hurt');
    E.state = 'rec'; E.t = 3;
    return;
  }

  // 玩家闪避
  let dodge = d.dodge + (P.buffs.dodge ? 30 : 0);
  if (Math.random() * 100 < dodge) {
    log('你闪开了 ' + E.name + ' 的【' + sk.name + '】。', 'mute');
    E.state = 'rec'; E.t = 3;
    return;
  }

  let mult = 1 + (E.atkUp > 0 ? 0.3 : 0);
  if (P.state === 'rec') { mult *= OPENING_DMG; log('你露出了破绽！', 'warn'); }
  if (P.buffs.guard) mult *= 0.55;

  const hits = sk.hits || 1;
  let total = 0;
  for (let i = 0; i < hits; i++) {
    let dmg = E.atk * ((sk.power || 100) / 100) * (0.9 + Math.random() * 0.2) * mult;
    dmg *= 100 / (100 + d.def * 1.6);
    total += Math.max(1, Math.round(dmg));
  }

  S.hp = Math.max(0, S.hp - total);
  log(E.name + ' 的【' + sk.name + '】命中，你受到 ' + total + ' 点伤害。', 'hurt');

  // 打断玩家前摇
  if (P.state === 'cast') {
    P.state = 'stun'; P.t = 3; P.pending = null; P.combo = 0;
    log('你的施法被打断了！', 'warn');
  }

  E.state = 'rec';
  E.t = Math.max(1, Math.round((sk.rec || 4) * (1 - Math.min(0.2, E.spd * 0.006))));
}

/* ---------------------------------------------------------------- 结算 */
function checkEnd(S) {
  if (S.hp <= 0) { end('lose'); return; }
  if (E.hp <= 0) { end('win'); return; }
}

function end(result) {
  if (!running) return;
  running = false;
  clearInterval(timer);
  timer = null;
  render();
  lastResult = result;

  const S = api.S;
  const secs = ((Date.now() - startTime) / 1000).toFixed(1);
  lastSecs = (Date.now() - startTime) / 1000;

  let html = '';
  if (result === 'win') {
    S.kills = (S.kills || 0) + 1;
    S.gold += E.gold;
    log('击败 ' + E.name + '。', 'good');
    log('获得经验 ' + E.exp + '，银币 ' + E.gold + '。', 'sys');
    (E.loot || []).forEach(l => {
      if (Math.random() < (l.p == null ? 1 : l.p)) {
        api.addItem(l.id, l.n || 1);
        log('获得 ' + ITEMS[l.id].name + ' ×' + (l.n || 1), 'sys');
      }
    });
    api.addExp(E.exp);
    api.saveGame();
    api.updateUI();
    html = '<button class="act-btn" data-act="continue" style="grid-column:1/-1">' +
           '<span class="an">继 续</span><span class="ac">用时 ' + secs + ' 秒 · 离开战斗</span></button>';
  } else if (result === 'lose') {
    S.hp = 1;
    api.saveGame(); api.updateUI();
    log('你倒下了。', 'hurt');
    html = '<button class="act-btn" data-act="continue" style="grid-column:1/-1">' +
           '<span class="an">复 活</span></button>';
  } else {
    api.saveGame();
    html = '<button class="act-btn" data-act="continue" style="grid-column:1/-1">' +
           '<span class="an">撤 退</span></button>';
  }

  const acts = api.el('battle-actions');
  if (acts) acts.innerHTML = html;
  const strip = api.el('combo-strip');
  if (strip) strip.className = 'combo-strip';

  lastSecs = lastSecs || 0;
  lastResult = { result: result, seconds: lastSecs };

  const btn = acts && acts.querySelector('[data-act="continue"]');
  if (btn) {
    btn.addEventListener('click', () => {
      if (!onEndCb) return;
      const cb = onEndCb;
      onEndCb = null;
      cb(result);
    });
  }
}

/* ---------------------------------------------------------------- 撤退 */
function flee() {
  if (!running || P.state !== 'idle') return;
  const S = api.S;
  const d = api.derived(S);
  const ok = Math.random() * 100 < 35 + S.agi * 2;
  if (ok) { log('你退开了，脱离战斗。', 'good'); end('flee'); }
  else {
    log('没能脱身！', 'warn');
    P.state = 'rec'; P.t = 6; P.penalty = true;
  }
}

/* ---------------------------------------------------------------- 渲染 */
function el(id) { return document.getElementById ? document.getElementById(id) : api.el(id); }

function buildBattleUI() {
  const S = api.S;
  api.paintPortrait('self-avatar', S.cls, 'face');
  renderActions();
}

/* 技能按钮 + 千机伞形态条 */
function renderActions() {
  const S = api.S;
  const box = api.el('battle-actions');
  if (!box) return;
  P.form = P.form || S.form || 'sword';

  let h = '';
  if (S.cls === 'sanren') {
    h += '<div class="form-row">';
    UMBRELLA_FORMS.forEach(f => {
      h += '<button class="form-chip' + (f.id === P.form ? ' on' : '') + '"' +
           ' data-form="' + f.id + '">' + f.name + '</button>';
    });
    h += '</div>';
  }

  h += '<button class="act-btn" data-act="attack" data-id="__basic">' +
       '<span class="an">普通攻击</span><span class="ac">无消耗 · 会断连</span></button>';

  api.skillBarOf(S, P.form).forEach(id => {
    const sk = SKILLS[id];
    if (!sk) return;
    h += '<button class="act-btn skill" data-act="skill" data-id="' + id + '">' +
         '<i class="cdmask"></i><span class="an">' + sk.name + '</span>' +
         '<span class="ac">MP ' + sk.mp + '</span></button>';
  });

  h += '<button class="act-btn" data-act="flee"><span class="an">撤退</span>' +
       '<span class="ac">敏捷判定</span></button>';

  box.innerHTML = h;

  Array.prototype.forEach.call(box.querySelectorAll('.form-chip'), c => {
    c.addEventListener('click', () => {
      if (!running) return;
      P.form = c.dataset.form;
      api.S.form = P.form;
      renderActions();
      render();
    });
  });

  P.btns = Array.prototype.map.call(box.querySelectorAll('.act-btn'), b => ({
    el: b, act: b.dataset.act, id: b.dataset.id,
    mask: b.querySelector('.cdmask'), sub: b.querySelector('.ac')
  }));
  P.btns.forEach(b => {
    b.el.addEventListener('click', () => {
      if (!running) return;
      if (b.act === 'flee') { flee(); return; }
      if (b.act === 'attack') { tryBasic(); return; }
      tryCast(api.S, b.id);
    });
  });
}
function tryBasic() {
  if (P.state === 'rec') { P.queue = '__basic'; return; }
  if (P.state !== 'idle') return;
  P.queue = null;
  P.combo = 0; P.lastIdx = -1; P.lastSchool = null; P.lastForm = null;
  P.pending = '__basic';
  P.mul = 1; P.recMod = 1 * P.spdMod; P.penalty = false;
  P.state = 'cast'; P.t = 2;
  log('普通攻击。', 'mute');
}

function render() {
  const S = api.S;
  const d = api.derived(S);
  const $ = api.el;

  // 敌人
  const fn = $('foe-name'), fl = $('foe-lv'), fh = $('foe-hp'), ft = $('foe-hptext');
  if (fn) fn.textContent = E.name;
  if (fl) fl.textContent = 'Lv.' + E.level + (E.boss ? ' · BOSS' : '') +
    (E.defDown > 0 ? ' · 破防' : '') + (E.atkUp > 0 ? ' · 强化' : '');
  if (fh) fh.style.width = Math.max(0, E.hp / E.maxHp * 100) + '%';
  if (ft) ft.textContent = Math.max(0, E.hp) + ' / ' + E.maxHp;

  // 敌人施法条
  const fc = $('foe-cast');
  if (fc) {
    if (E.state === 'cast' && E.pending) {
      const p = 1 - (E.t / (E.castLen || 3));
      fc.style.opacity = 1;
      fc.className = 'cast-bar on';
      fc.querySelector('i').style.width = (p * 100) + '%';
      fc.querySelector('span').textContent = E.pending.name;
    } else if (E.state === 'stun') {
      fc.style.opacity = 1; fc.className = 'cast-bar stun';
      fc.querySelector('i').style.width = '100%';
      fc.querySelector('span').textContent = '硬直';
    } else {
      fc.style.opacity = 0;
    }
  }

  // 玩家
  const sb = $('self-bars');
  if (sb) {
    sb.innerHTML =
      '<div class="bar hp"><i style="width:' + Math.max(0, S.hp / d.maxHp * 100) + '%"></i>' +
      '<b>' + Math.round(S.hp) + ' / ' + d.maxHp + '</b></div>' +
      '<div class="bar mp"><i style="width:' + Math.max(0, S.mp / d.maxMp * 100) + '%"></i>' +
      '<b>' + Math.round(S.mp) + ' / ' + d.maxMp + '</b></div>';
  }

  const sc = $('self-cast');
  if (sc) {
    if (P.state === 'cast') {
      const ps = P.pending === '__basic' ? 2 : (SKILLS[P.pending] ? SKILLS[P.pending].cast : 2);
      sc.className = 'cast-bar on mine';
      sc.querySelector('i').style.width = ((1 - P.t / Math.max(1, ps)) * 100) + '%';
      sc.querySelector('span').textContent = '前摇 · ' +
        (P.pending === '__basic' ? '普通攻击' : (SKILLS[P.pending] ? SKILLS[P.pending].name : ''));
    } else if (P.state === 'rec') {
      sc.className = 'cast-bar ' + (P.penalty ? 'warn' : 'rec');
      sc.querySelector('i').style.width = '100%';
      sc.querySelector('span').textContent = P.penalty ? '后摇 · 破绽！' : '后摇';
    } else if (P.state === 'stun') {
      sc.className = 'cast-bar stun';
      sc.querySelector('span').textContent = '硬直';
    } else {
      sc.className = 'cast-bar idle';
      sc.querySelector('span').textContent = P.queue ? '已预输入' : '可行动';
    }
  }

  // 连招条
  renderCombo();

  // 按钮
  const cls = api.classOf(S.cls);
  (P.btns || []).forEach(b => {
    if (b.act === 'flee') { b.el.disabled = P.state !== 'idle'; return; }
    if (b.act === 'attack') { b.el.disabled = P.state === 'stun'; return; }
    const sk = SKILLS[b.id];
    const cd = P.cd[b.id] || 0;
    const noMp = S.mp < sk.mp;
    const next = isNextSkill(cls, b.id);
    b.el.disabled = cd > 0 || noMp || P.state === 'stun';
    b.el.classList.toggle('next', next);
    if (b.mask) b.mask.style.width = cd > 0 ? Math.min(100, cd / sk.cd * 100) + '%' : '0%';
    if (b.sub) {
      b.sub.textContent = cd > 0 ? 'CD ' + (cd / 5).toFixed(1) + 's'
        : noMp ? '法力不足'
        : (sk.cast + ' 拍 / ' + sk.rec + ' 拍');
    }
  });
}

function isNextSkill(cls, id) {
  const sk = SKILLS[id];
  if (sk.util) return false;
  if (cls.freeChain) {
    return !!P.lastForm && P.form !== P.lastForm;
  }
  const idx = cls.chain.indexOf(id);
  if (idx < 0) return false;
  return idx === P.lastIdx + 1;
}

function renderCombo() {
  const box = api.el('combo-strip');
  if (!box) return;
  const cls = api.classOf(api.S.cls);
  let h = '<span class="cb-tag">连招</span>';

  if (cls.freeChain) {
    const last = P.lastForm ? (FORM_NAME[P.lastForm] + '形态') : '任意起手';
    const canLink = !P.lastForm || P.form !== P.lastForm;
    h += '<span class="cb-step ' + (P.lastForm ? 'on' : 'next') + '">' + last + '</span>';
    h += '<span class="cb-arrow">→</span>';
    h += '<span class="cb-step ' + (canLink ? 'next' : '') + '">' +
         (canLink ? '可接' : '换形态可接') + '</span>';
    if (P.combo > 0) h += '<span class="cb-count">×' + (P.combo + 1) + '</span>';
  } else {
    const chain = cls.chain;
    chain.forEach((sid, i) => {
      let c = '';
      if (i <= P.lastIdx) c = 'on';
      else if (i === P.lastIdx + 1) c = 'next';
      h += '<span class="cb-step ' + c + '">' + SKILLS[sid].name + '</span>';
      if (i < chain.length - 1) h += '<span class="cb-arrow">›</span>';
    });
    if (P.combo > 0) h += '<span class="cb-count">×' + (P.combo + 1) + '</span>';
    if (P.penalty) h += '<span class="cb-penalty">断连 · 破绽</span>';
  }

  box.className = 'combo-strip' + (P.combo > 0 ? ' live' : '');
  box.innerHTML = h;
}

/* ---------------------------------------------------------------- 日志 */
function log(msg, kind) {
  const box = api.el('battle-log');
  if (!box) return;
  const d = document.createElement('div');
  d.className = 'log-line ' + (kind || '');
  d.textContent = msg;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 60) box.removeChild(box.firstChild);
}

/* ---------------------------------------------------------------- 对外 */
return {
  configure: configure,
  start: function (enemyId, opts) {
    onEndCb = opts && opts.onEnd;
    start(enemyId, opts);
  },
  flee: flee,
  lastSeconds: () => lastSecs,
  isRunning: () => running
};

})();

</script>
<script>
/* ==========================================================================
   荣耀 · 第十区  —   引擎
   场景 / 面板 / 存档 / 副本榜单 / 知名度
   ========================================================================== */
'use strict';

(function () {

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const SAVE_KEY = 'glory10.save.v2';

let S = null;
let curTab = 'attr';
let selClass = 'jianke';
let selSchool = '剑士系';
let curChoices = [];

const classOf = id => CLASSES[id];

/* ---------------------------------------------------------- 派生数值 */
function derived(st) {
  const bonus = { atk: 0, def: 0, hp: 0, mp: 0, spd: 0, crit: 0 };
  ['weapon', 'armor'].forEach(slot => {
    const id = st.equip && st.equip[slot];
    const it = id ? ITEMS[id] : null;
    if (it && it.bonus) for (const k in it.bonus) bonus[k] += it.bonus[k];
  });
  const lv = st.level;
  const atkOf = m => Math.round(10 + st[m] * 2.2 + lv * 2 + bonus.atk);
  return {
    maxHp: Math.round(110 + st.con * 13 + lv * 14 + bonus.hp),
    maxMp: Math.round(50 + st.int * 8 + lv * 5 + bonus.mp),
    def:   Math.round(4 + st.con * 1.1 + lv * 1 + bonus.def),
    spd:   Math.round(8 + st.agi * 1.5 + bonus.spd),
    crit:  Math.round((4 + st.agi * 0.5 + bonus.crit) * 10) / 10,
    dodge: Math.round((2 + st.agi * 0.3) * 10) / 10,
    atk: { str: atkOf('str'), agi: atkOf('agi'), int: atkOf('int'), con: atkOf('con') }
  };
}

const expNeed = lv => Math.round(90 * Math.pow(1.3, lv - 1));

/* ------------------------------------------------------------------ 提示 */
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* -------------------------------------------------------------- 背包 */
function addItem(id, n) {
  if (!ITEMS[id]) return;
  S.inv[id] = (S.inv[id] || 0) + (n || 1);
}
function removeItem(id, n) {
  n = n || 1;
  if (!S.inv[id]) return;
  S.inv[id] -= n;
  if (S.inv[id] <= 0) delete S.inv[id];
}
function sellItem(id) {
  const it = ITEMS[id];
  if (!it) return;
  const price = Math.floor((it.price || 0) * 0.5);
  removeItem(id, 1);
  S.gold += price;
  toast('卖出 ' + it.name + '，+' + price + ' 银币');
  updateUI(); saveGame();
}

function addExp(n) {
  S.exp += n;
  let up = 0;
  while (S.exp >= expNeed(S.level)) {
    S.exp -= expNeed(S.level);
    S.level++;
    S.free += 3;
    up++;
  }
  if (up) {
    const p = derived(S);
    S.hp = p.maxHp; S.mp = p.maxMp;
    toast('等级提升！Lv.' + S.level + '　获得 ' + (up * 3) + ' 点自由属性');
  }
}

/* -------------------------------------------------------------- 屏幕 */
function showScreen(id) {
  $$('.screen').forEach(s => s.classList.remove('show'));
  $('#' + id).classList.add('show');
}

/* ---------------------------------------------------------- 打字机 */
const typing = { text: '', i: 0, timer: null, done: null, active: false };

function typeText(text, done) {
  clearTimeout(typing.timer);
  const el = $('#prose');
  el.textContent = '';
  $('#choices').innerHTML = '';
  $('#stage').scrollTop = 0;
  typing.text = text; typing.i = 0; typing.done = done; typing.active = true;

  const step = () => {
    if (!typing.active) return;
    typing.i += 2;
    if (typing.i >= text.length) { finishTyping(); return; }
    el.textContent = text.slice(0, typing.i);
    typing.timer = setTimeout(step, 10);
  };
  step();
}

function finishTyping() {
  if (!typing.active) return;
  typing.active = false;
  clearTimeout(typing.timer);
  $('#prose').innerHTML = esc(typing.text)
    .replace(/【([^】\n]*)】/g, '<span class="sys">【$1】</span>');
  $('#stage').scrollTop = 0;
  const cb = typing.done; typing.done = null;
  if (cb) cb();
}

/* ---------------------------------------------------------- 场景引擎 */
function go(id) {
  if (!SCENES[id]) { console.warn('缺少场景：' + id); return; }
  S.scene = id;
  const sc = SCENES[id];
  if (sc.onEnter) sc.onEnter(S);

  const dp = derived(S);
  S.hp = clamp(S.hp, 0, dp.maxHp);
  S.mp = clamp(S.mp, 0, dp.maxMp);

  saveGame();
  renderScene();
}

function renderScene() {
  const sc = SCENES[S.scene];
  if (!sc) return;

  $('#tb-chapter').textContent = sc.chapter || '荣耀 · 第十区';
  $('#art').className = 'art art-' + (sc.art || 'night');
  paintPortrait('#art-char', S.cls, 'char');
  updateUI();

  const text = typeof sc.text === 'function' ? sc.text(S) : (sc.text || '');

  if (sc.instant) {
    clearTimeout(typing.timer);
    typing.active = false; typing.text = text; typing.done = null;
    $('#prose').innerHTML = esc(text).replace(/【([^】\n]*)】/g, '<span class="sys">【$1】</span>');
    $('#choices').innerHTML = '';
    $('#stage').scrollTop = 0;
    renderChoices(sc);
  } else {
    typeText(text, () => renderChoices(sc));
  }
}

function renderChoices(sc) {
  const list = typeof sc.choices === 'function' ? sc.choices(S) : (sc.choices || []);
  curChoices = list;
  const wrap = $('#choices');
  wrap.innerHTML = '';
  list.forEach((ch, i) => {
    const ok = !ch.req || ch.req(S);
    const b = document.createElement('button');
    b.className = 'choice';
    b.disabled = !ok;
    b.innerHTML =
      '<span class="num">' + (i + 1) + '</span>' +
      '<span class="txt">' + esc(ch.label) + '</span>' +
      (ch.hint ? '<span class="hint">' + esc(ch.hint) + '</span>' : '') +
      (!ok && ch.reqText ? '<span class="lock">需 ' + esc(ch.reqText) + '</span>' : '');
    if (ok) b.addEventListener('click', () => choose(ch));
    wrap.appendChild(b);
  });
}

function choose(ch) {
  if (ch.req && !ch.req(S)) return;
  if (ch.combat) {
    startCombat(ch.combat.enemy, {
      win: ch.combat.win, lose: ch.combat.lose, flee: ch.combat.flee,
      dungeon: ch.combat.dungeon
    });
    return;
  }
  if (ch.run) {
    const before = S.scene;
    if (typeof ch.run === 'string') { if (RUN[ch.run]) RUN[ch.run](); }
    else ch.run();
    if (S.scene === before) renderChoices(SCENES[S.scene]);
    return;
  }
  if (ch.to) go(ch.to);
}

const RUN = {};

/* ---------------------------------------------------------- 战斗入口 */
function startCombat(enemyId, opts) {
  opts = opts || {};
  Combat.start(enemyId, {
    onEnd: function (result) {
      const ov = $('#overlay');
      if (ov) ov.hidden = true;
      if (result === 'win' && opts.dungeon) {
        recordDungeon(opts.dungeon, Combat.lastSeconds());
      }
      const target = result === 'win' ? (opts.win || S.scene)
                   : result === 'lose' ? (opts.lose || 's_death')
                   : (opts.flee || S.scene);
      go(target);
    }
  });
}

/* ---------------------------------------------------------- 副本榜单 */
function rankOf(did, t) {
  const d = DUNGEONS[did];
  if (!d) return 0;
  return d.board.filter(b => b.time < t).length + 1;
}

function recordDungeon(did, seconds) {
  const d = DUNGEONS[did];
  if (!d) return;
  S.records = S.records || {};
  const t = Math.max(1, Math.round(seconds * 10) / 10);
  const prev = S.records[did];
  const msg = [];

  if (!prev) {
    S.records[did] = { best: t, clears: 1 };
    S.fame = (S.fame || 0) + 50;
    msg.push('首杀！知名度 +50');
  } else if (t < prev.best) {
    const gain = Math.max(3, Math.round((prev.best - t) * 2));
    S.records[did].best = t;
    S.records[did].clears = (prev.clears || 1) + 1;
    S.fame = (S.fame || 0) + gain;
    msg.push('刷新记录 ' + prev.best.toFixed(1) + 's → ' + t.toFixed(1) + 's，知名度 +' + gain);
  } else {
    S.records[did].clears = (prev.clears || 1) + 1;
    msg.push('通关 ' + t.toFixed(1) + 's（个人最好 ' + prev.best.toFixed(1) + 's）');
  }

  const rank = rankOf(did, S.records[did].best);
  msg.push('系统榜单第 ' + rank + ' 位');
  S.lastRecord = msg.join('　');

  if (did === 'qianbo' && !S.flags.ch1) S.flags.ch1 = true;
  saveGame();
  toast(msg[0]);
}

function buildBoardText(st) {
  let out = '系统榜单 · 第十区\n';
  Object.keys(DUNGEONS).forEach(id => {
    const d = DUNGEONS[id];
    out += '\n【' + d.name + '】' + d.lv + '\n';
    const rows = d.board.map(b => ({ name: b.name, time: b.time, mine: false }));
    const rec = st.records && st.records[id];
    rows.push(rec ? { name: st.name + '（我）', time: rec.best, mine: true }
                  : { name: '—— 未上榜 ——', time: null, mine: true });
    rows.sort((a, b) => (a.time == null ? 1e9 : a.time) - (b.time == null ? 1e9 : b.time));
    rows.slice(0, 6).forEach((r, i) => {
      const rank = String(i + 1).padStart(2, ' ');
      const tm = r.time == null ? '   —   ' : r.time.toFixed(1) + 's';
      out += '　' + rank + '. ' + r.name.padEnd(12, '　') + tm + (r.mine ? '  ◀' : '') + '\n';
    });
  });
  return out;
}

function skillBarOf(st, form) {
  if (st.cls !== 'sanren') return CLASSES[st.cls].skillIds;
  return FORM_SKILLS[form || st.form || 'sword'] || [];
}

/* ---------------------------------------------------------- 立绘 */
function paintPortrait(sel, clsId, mode) {
  const el = sel.charAt(0) === '#' ? $(sel) : $('#' + sel);
  if (!el) return;
  mode = mode || 'full';
  const key = clsId + '|' + mode;
  if (el.dataset.cls === key) return;
  el.dataset.cls = key;
  el.innerHTML = portraitSVG(clsId, mode);
  el.style.setProperty('--pc', portraitColor(clsId));
}

/* ---------------------------------------------------------- 面板 */
function barHtml(cls, v, max) {
  const pct = clamp(v / max * 100, 0, 100);
  return '<div class="bar ' + cls + '"><i style="width:' + pct + '%"></i>' +
         '<b>' + Math.round(v) + ' / ' + Math.round(max) + '</b></div>';
}

function updateUI() {
  if (!S) return;
  const p = derived(S);
  S.hp = clamp(S.hp, 0, p.maxHp);
  S.mp = clamp(S.mp, 0, p.maxMp);

  $('#tb-name').textContent = S.name;
  $('#tb-class').textContent = CLASSES[S.cls].name;
  $('#tb-gold').textContent = S.gold + ' 银';
  const fam = $('#tb-fame');
  if (fam) fam.textContent = '知名度 ' + (S.fame || 0);

  $('#p-name').textContent = S.name;
  $('#p-meta').textContent = 'Lv.' + S.level + ' · ' + CLASSES[S.cls].name;

  paintPortrait('#p-portrait', S.cls, 'face');

  $('#p-bars').innerHTML =
    barHtml('hp', S.hp, p.maxHp) + barHtml('mp', S.mp, p.maxMp) +
    barHtml('xp', S.exp, expNeed(S.level));

  renderTab();
}

function row(k, v) {
  return '<div class="stat-row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
}

function sanrenSkillTab() {

       '战斗中随时变形，<b>换过形态的下一招必定接上连招</b>（+15%）；同一个形态连打会断连。</p>';
  UMBRELLA_FORMS.forEach(f => {

    h += '<div class="form-card' + (on ? ' on' : '') + '" data-formset="' + f.id + '">' +
         '<div class="fc-h"><b>' + f.name + '形态</b><span>' + f.desc + '</span>' +
         (on ? '<em>当前</em>' : '') + '</div>' +
         '<div class="fc-sk">' + FORM_SKILLS[f.id].map(id => SKILLS[id].name).join('　') + '</div>' +

  });

function setSanrenForm(id) {
  if (!FORM_SKILLS[id]) return;
  S.form = id;
  S.skills = FORM_SKILLS[id].slice();
  saveGame();
  renderTab();
  toast('千机伞 · ' + FORM_NAME[id] + '形态');
}
function renderTab() {
  const body = $('#p-body');
  const p = derived(S);
  const cls = CLASSES[S.cls];
  let h = '';

  if (curTab === 'attr') {
    h += '<div class="sec-title">基础属性</div>';
    if (S.free > 0) h += '<div class="free-pt">可分配点数：' + S.free + '</div>';
    const rows = [['str', '力量'], ['agi', '敏捷'], ['int', '智力'], ['con', '体质']];
    rows.forEach(r => {
      h += '<div class="stat-row"><span class="k">' + r[1] + (cls.main === r[0] ? ' <em>主</em>' : '') +
        '</span><span class="v">' + S[r[0]] +
        (S.free > 0 ? ' <button class="plus" data-plus="' + r[0] + '">+</button>' : '') +
        '</span></div>';
    });
    h += '<div class="sec-title">战斗数值</div>';
    h += row('攻击', p.atk[cls.main]);
    h += row('防御', p.def);
    h += row('生命', p.maxHp);
    h += row('法力', p.maxMp);
    h += row('速度', p.spd);
    h += row('暴击', p.crit + '%');
    h += row('闪避', p.dodge + '%');
    h += '<div class="sec-title">档案</div>';
    h += row('派系', cls.school);
    h += row('定位', cls.role);
    h += row('知名度', S.fame || 0);
    h += row('击杀', S.kills || 0);
  }

  if (curTab === 'bag') {
    h += '<div class="sec-title">装备中</div>';
    const slotName = { weapon: '武器', armor: '防具' };
    ['weapon', 'armor'].forEach(slot => {
      const id = S.equip[slot];
      const it = id ? ITEMS[id] : null;
      h += '<div class="item-row"><span class="nm">' + (it ? it.name : '（空）') +
           '<small>' + slotName[slot] + '</small></span></div>';
    });
    h += '<div class="sec-title">背包</div>';
    const ids = Object.keys(S.inv).filter(id => S.inv[id] > 0);
    if (!ids.length) h += '<div class="empty">空空如也。</div>';
    ids.forEach(id => {
      const it = ITEMS[id];
      if (!it) return;
      let btn = '';
      if (it.type === 'consume') btn = '<button class="mini" data-use="' + id + '">使用</button>';
      else if (it.type === 'equip') btn = '<button class="mini" data-equip="' + id + '">装备</button>';
      else btn = '<button class="mini" data-sell="' + id + '">卖出</button>';
      h += '<div class="item-row"><span class="nm">' + it.name +
           '<small>' + it.desc + '</small></span>' +
           '<span class="ct">×' + S.inv[id] + '</span>' + btn + '</div>';
    });
  }

  if (curTab === 'skill') {
    if (cls.freeChain) {
      h += sanrenSkillTab();
    } else {
      h += '<div class="sec-title">' + cls.name + ' · 连招链</div>';
      const chain = cls.chain;
      h += '<div class="chain-path">' + chain.map((x, i) =>
        (i ? '<span class="ar">›</span>' : '') +
        '<span>' + SKILLS[x].name + '</span>').join('') + '</div>';
      h += '<p class="chain-note">按顺序命中后摇只有 55%，伤害逐层 +18%；打满整套额外 +30%、返还一半法力、并使目标破防。不按顺序放，后摇 160% 且挂破绽。</p>';
      h += '<div class="sec-title">技能</div>';
      cls.skillIds.forEach(id => {
        const sk = SKILLS[id];
        const ci = cls.chain.indexOf(id);
        const pos = ci >= 0 ? (ci + 1) + ' 式' : '辅助';
        h += '<div class="skill-row"><div class="sn"><b>' + sk.name + '</b>' +
             '<span>' + pos + ' · ' + sk.cast + '+' + sk.rec + ' 拍</span></div>' +
             '<p>' + sk.desc + '</p>' +
             '<p class="chainpos"><span>MP ' + sk.mp + ' · CD ' + (sk.cd / 5).toFixed(1) + 's</span></p></div>';
      });
    }
  }

  if (curTab === 'sys') {
    h += '<div class="sec-title">存档</div>';
    h += '<div class="item-row"><span class="nm">自动存档已开启</span>' +
         '<button class="mini" data-cmd="save">立即保存</button></div>';
    h += '<div class="item-row"><span class="nm">读取上次存档</span>' +
         '<button class="mini" data-cmd="load">读取</button></div>';
    h += '<div class="item-row"><span class="nm">重新开始</span>' +
         '<button class="mini" data-cmd="restart">重来</button></div>';
    h += '<div class="sec-title">记录</div>';
    h += row('章节', (SCENES[S.scene] && SCENES[S.scene].chapter) || '—');
    h += row('知名度', S.fame || 0);
    h += row('击杀', S.kills || 0);
    Object.keys(S.records || {}).forEach(id => {
      h += row(DUNGEONS[id] ? DUNGEONS[id].name : id, S.records[id].best.toFixed(1) + 's');
    });
  }

  body.innerHTML = h;
}

/* -------------------------------------------------------------- 物品 */
function useItem(id) {
  const it = ITEMS[id];
  if (!it) return;
  if (it.type === 'equip') { equipItem(id); return; }
  if (it.type !== 'consume') return;
  const p = derived(S);
  if (it.heal) {
    if (S.hp >= p.maxHp) { toast('生命已满。'); return; }
    S.hp = Math.min(p.maxHp, S.hp + it.heal);
  }
  if (it.mana) {
    if (S.mp >= p.maxMp) { toast('法力已满。'); return; }
    S.mp = Math.min(p.maxMp, S.mp + it.mana);
  }
  removeItem(id, 1);
  toast('使用了 ' + it.name);
  updateUI(); saveGame();
}

function equipItem(id) {
  const it = ITEMS[id];
  if (!it || it.type !== 'equip' || !S.inv[id]) return;
  const old = S.equip[it.slot];
  S.equip[it.slot] = id;
  removeItem(id, 1);
  if (old) addItem(old, 1);
  toast('装备 ' + it.name);
  updateUI(); saveGame();
}

function autoEquip() {
  const worth = it => it
    ? (it.bonus.atk || 0) * 2 + (it.bonus.def || 0) + (it.bonus.hp || 0) / 10 + (it.bonus.crit || 0)
    : -1;
  ['weapon', 'armor'].forEach(slot => {
    let best = null;
    let bestV = worth(S.equip[slot] ? ITEMS[S.equip[slot]] : null);
    Object.keys(S.inv).forEach(id => {
      const it = ITEMS[id];
      if (!it || it.type !== 'equip' || it.slot !== slot || !S.inv[id]) return;
      const v = worth(it);
      if (v > bestV) { best = id; bestV = v; }
    });
    if (best) equipItem(best);
  });
}

/* -------------------------------------------------------------- 存档 */
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 忽略 */ }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const o = JSON.parse(raw);
    if (!o || !o.cls || !CLASSES[o.cls] || !SCENES[o.scene]) return false;
    S = o;
    if (!S.records) S.records = {};
    if (S.fame == null) S.fame = 0;
    return true;
  } catch (e) { return false; }
}
function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}

/* -------------------------------------------------------------- 新建 */
function newGame() {
  const name = ($('#inp-name').value || '').trim().slice(0, 8) || '无名氏';
  const c = CLASSES[selClass];
  S = {
    name: name, cls: selClass,
    level: 1, exp: 0, free: 0,
    str: c.base.str, agi: c.base.agi, int: c.base.int, con: c.base.con,
    hp: 1, mp: 1, gold: 300, fame: 0,
    inv: { potion_s: 3 },
    equip: { weapon: 'w_wood', armor: null },
    skills: c.freeChain ? FORM_SKILLS.sword.slice() : c.skillIds.slice(),
    form: c.freeChain ? 'sword' : null,
    flags: {}, kills: 0, records: {},
    scene: 's_open', startedAt: Date.now()
  };
  const p = derived(S);
  S.hp = p.maxHp; S.mp = p.maxMp;
  showScreen('scr-game');
  curTab = 'attr';
  $$('#p-tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'attr'));
  go('s_open');
}

/* -------------------------------------------------------------- 建档 */
function buildSchoolTabs() {
  const box = $('#school-tabs');
  box.innerHTML = '';
  SCHOOLS.forEach(school => {
    const b = document.createElement('button');
    b.textContent = school;
    b.className = school === selSchool ? 'on' : '';
    b.addEventListener('click', () => { selSchool = school; buildSchoolTabs(); buildClassCards(); });
    box.appendChild(b);
  });
}

function buildClassCards() {
  const g = $('#class-grid');
  g.innerHTML = '';
  const list = classList(selSchool);
  list.forEach(id => {
    const c = CLASSES[id];
    const b = document.createElement('button');
    b.className = 'class-card' + (id === selClass ? ' on' : '');
    b.innerHTML =
      '<div class="cc-cat">' + c.school + '</div>' +
      '<div class="cc-name">' + c.name + '</div>' +
      '<div class="cc-tag">' + c.role + '</div>';
    b.addEventListener('click', () => {
      selClass = id;
      buildClassCards();
      showClassDetail();
    });
    g.appendChild(b);
  });
  showClassDetail();
  checkEnter();
}

function showClassDetail() {
  const c = CLASSES[selClass];
  paintPortrait('#c-portrait', selClass, 'full');
  const list = c.freeChain
    ? '<em>千机伞 · 12 形态 · 120 个低阶技能</em>　换形态即换技能组'
    : c.skillIds.map(id => '· <em>' + SKILLS[id].name + '</em>').join('　');
  $('#class-detail').innerHTML =
    '<b>' + c.name + '</b>　<span class="cd-school">' + c.school + ' · ' + c.role + '</span><br>' +
    c.desc.replace(/\n/g, '<br>') +
    '<br><br>' + list;
}

function checkEnter() {
  $('#btn-enter').disabled = ($('#inp-name').value || '').trim().length === 0;
}

/* -------------------------------------------------------------- 事件 */
function bindEvents() {
  $('#btn-new').addEventListener('click', () => {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    buildSchoolTabs();
    buildClassCards();
    $('#inp-name').value = '';
    checkEnter();
    showScreen('scr-create');
    setTimeout(() => $('#inp-name').focus(), 60);
  });
  $('#btn-load').addEventListener('click', () => {
    if (loadGame()) {
      showScreen('scr-game');
      renderScene();
      toast('读取存档成功。');
    } else toast('没有可读取的存档。');
  });

  $('#inp-name').addEventListener('input', checkEnter);
  $('#inp-name').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !$('#btn-enter').disabled) $('#btn-enter').click();
  });
  $('#btn-back').addEventListener('click', () => showScreen('scr-title'));
  $('#btn-enter').addEventListener('click', newGame);

  $('#stage').addEventListener('click', () => {
    if (typing.active) finishTyping();
  });

  $('#btn-panel').addEventListener('click', () => $('#panel').classList.toggle('open'));

  $('#p-tabs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    curTab = b.dataset.tab;
    $$('#p-tabs button').forEach(x => x.classList.toggle('on', x === b));
    renderTab();
  });

  $('#p-body').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.plus) {
      if (S.free > 0) { S[b.dataset.plus]++; S.free--; updateUI(); saveGame(); }
    } else if (b.dataset.eq) equipSanrenSkill(b.dataset.eq);
    else if (b.dataset.un) unequipSanrenSkill(b.dataset.un);
    else if (b.dataset.formset) setSanrenForm(b.dataset.formset);
    else if (b.dataset.use) useItem(b.dataset.use);
    else if (b.dataset.equip) equipItem(b.dataset.equip);
    else if (b.dataset.sell) sellItem(b.dataset.sell);
    else if (b.dataset.cmd) {
      const cmd = b.dataset.cmd;
      if (cmd === 'save') { saveGame(); toast('已保存。'); }
      if (cmd === 'load') { if (loadGame()) { renderScene(); toast('已读取。'); } else toast('没有存档。'); }
      if (cmd === 'restart') {
        if (confirm('清空当前存档，重新开始？')) {
          try { localStorage.removeItem(SAVE_KEY); } catch (err) {}
          S = null; showScreen('scr-title'); $('#btn-load').disabled = !hasSave();
        }
      }
    }
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (!$('#scr-game').classList.contains('show')) return;
    if (typing.active && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); finishTyping(); return; }
    if (Combat.isRunning()) {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9) {
        const btns = $$('#battle-actions .act-btn');
        const b = btns[n - 1];
        if (b && !b.disabled) b.click();
      }
      return;
    }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9) {
      const btns = $$('#choices .choice');
      const b = btns[n - 1];
      if (b && !b.disabled) b.click();
    }
  });
}

/* -------------------------------------------------------------- 启动 */
function boot() {
  bindEvents();
  $('#btn-load').disabled = !hasSave();
  buildSchoolTabs();
  buildClassCards();

  window.GameAPI = {
    get S() { return S; },
    derived: derived,
    classOf: classOf,
    skillBarOf: skillBarOf,
    addExp: addExp,
    addItem: addItem,
    saveGame: saveGame,
    updateUI: updateUI,
    toast: toast,
    go: go,
    el: id => document.getElementById(id),
    paintPortrait: paintPortrait,
    openOverlay: () => { const o = $('#overlay'); if (o) o.hidden = false; }
  };
  Combat.configure(window.GameAPI);

  window.addItem = addItem;
  window.toast = toast;
  window.saveGame = saveGame;
  window.updateUI = updateUI;
  window.startCombat = startCombat;
  window.autoEquip = autoEquip;
  window.buildBoardText = buildBoardText;
  window.Glory = {
    go: go, startCombat: startCombat, autoEquip: autoEquip,
    addItem: addItem, toast: toast, saveGame: saveGame, updateUI: updateUI,
    derived: derived, expNeed: expNeed, recordDungeon: recordDungeon
  };
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();

</script>
</body>
</html>
